<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>新規登録</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f7fb;font-family:-apple-system}
.box{background:white;padding:32px;border-radius:20px}
input,button{width:100%;padding:12px;margin-top:12px}
</style>
</head>
<body>
<form class="box" method="post">
<h2>新規登録</h2>
<input name="username" required>
<input name="password" type="password" required>
<button>登録</button>
</form>
</body>
</html>
