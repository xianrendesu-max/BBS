<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#eef2f7;font-family:-apple-system}
.card{background:white;padding:32px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.12);width:320px}
input,button{width:100%;padding:12px;margin-top:12px;border-radius:12px}
button{background:#111;color:white;border:none}
</style>
</head>
<body>
<form class="card" method="post">
<h2>管理者ログイン</h2>
<input name="username" value="admin" required>
<input name="password" type="password" required>
<button>ログイン</button>
</form>
</body>
</html>
